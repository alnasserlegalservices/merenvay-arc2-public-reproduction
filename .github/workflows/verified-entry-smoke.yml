name: ARC Verified entry smoke test

on:
  push:
    branches:
      - verification/arc-agi2-generic-submission
    paths:
      - "verification/**"
      - "merenvay_dispatch_fix.patch"
      - ".github/workflows/verified-entry-smoke.yml"
  workflow_dispatch:

jobs:
  verified-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox

      - name: Run full answer-isolated entry path
        run: |
          python verification/verified_entry.py \
            --challenges verification/tests/fixture_challenges.json \
            --output verification/tests/verified_entry_submission.json \
            --workdir "$RUNNER_TEMP/merenvay-verified" \
            --skip-swipl-install

      - name: Validate generated submission
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("verification/tests/verified_entry_submission.json")
          data = json.loads(p.read_text())
          entries = data["fixture_flip"]
          assert len(entries) == 1
          entry = entries[0]

          # attempt_1 must be the expected answer-independent first candidate.
          assert entry["attempt_1"] == [[0,4],[6,5]], entry

          # attempt_2 may legitimately be a distinct second candidate.
          # Validate only the ARC contract here.
          for key in ("attempt_1", "attempt_2"):
              grid = entry[key]
              assert isinstance(grid, list) and grid
              width = len(grid[0])
              assert width > 0
              assert all(isinstance(row, list) and len(row) == width for row in grid)
              assert all(isinstance(cell, int) and 0 <= cell <= 9 for row in grid for cell in row)

          print("full verified entry smoke OK")
          PY
